{% extends "base.html" %} {% load socialaccount %} {% block title %}Login{%
endblock %} {% block content %}
<div class="flex items-center justify-center min-h-[70vh]">
  <div class="w-full max-w-md bg-white p-8 rounded-2xl shadow-lg">
    <h2 class="text-2xl font-bold text-center text-emerald-700 mb-6">
      Log in to Luxshop
    </h2>

    <!-- Django default login form -->
    <form method="post" class="space-y-4">
      {% csrf_token %} {{ form.as_p }}
      <button
        type="submit"
        class="w-full px-4 py-2 bg-emerald-600 text-white font-medium rounded-lg shadow hover:bg-emerald-700 transition"
      >
        Log In
      </button>
    </form>

    <!-- Divider -->
    <div class="flex items-center my-6">
      <hr class="flex-grow border-gray-300" />
      <span class="px-2 text-gray-500 text-sm">or</span>
      <hr class="flex-grow border-gray-300" />
    </div>

    <!-- Google Login -->
    <a
      href="{% provider_login_url 'google' %}"
      aria-label="Continue with Google"
      class="flex items-center justify-center gap-2 w-full px-4 py-2 rounded-lg bg-white text-gray-700 font-medium border hover:bg-gray-100 shadow transition"
    >
      <img
        src="https://www.svgrepo.com/show/355037/google.svg"
        alt="Google"
        class="w-5 h-5"
      />
      Continue with Google
    </a>

    <!-- Link to signup -->
    <p class="text-center text-sm text-gray-600 mt-6">
      Don’t have an account?
      <a
        href="{% url 'core:signup' %}"
        class="text-emerald-600 font-medium hover:underline"
        >Sign Up</a
      >
    </p>
  </div>
</div>
{% endblock %}
