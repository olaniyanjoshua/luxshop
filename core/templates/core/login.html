{% extends 'core/base.html' %}

{% block title %} Log In {% endblock %}

{% block content %}
<div class="max-w-2xl mx-auto bg-white shadow-lg rounded-xl p-8 mt-10">
    <h1 class="text-3xl font-bold text-emerald-700 mb-6 text-center">Log In</h1>

    <form method="POST" action="." class="space-y-6">
        {% csrf_token %}

        <div>
            <label class="block mb-2 text-sm font-medium text-gray-700 text-center">
                Username
            </label>
            <input type="text" name="username" required
                class="w-full p-3 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-300 focus:border-blue-400"
                value="{{ form.username.value|default:'' }}">
        </div>

        <div>
            <label class="block mb-2 text-sm font-medium text-gray-700 text-center">
                Password
            </label>
            <input type="password" name="password" required
                class="w-full p-3 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-300 focus:border-blue-400">
        </div>

        {% if form.errors or form.non_field_errors %}
            <div class="p-4 rounded-lg bg-red-100 text-red-700">
                {% for field in form %}
                    {{ field.errors }}
                {% endfor %}
                {{ form.non_field_errors }}
            </div>
        {% endif %}

        <div class="text-center">
            <button type="submit" 
                class="bg-emerald-700 hover:bg-emerald-800 text-white px-6 py-3 rounded-lg shadow transition duration-200">
                Submit
            </button>
        </div>
    </form>

    <div class="mt-4 text-center">
        <a href="{% url 'core:password_reset' %}" class="text-blue-600 hover:underline">
            Forgot Password?
        </a>
    </div>
</div>
{% endblock %}
