{% extends 'core/base.html' %}
{% block title %}Set New Password{% endblock %}
{% block content %}
  <div class="w-1/2 my-6 p-6 mx-auto bg-gray-100 rounded-xl">
    <h1 class="text-xl mb-4">Set Your New Password</h1>
    <form method="post">
      {% csrf_token %}
      {{ form.new_password1.label_tag }}
      {{ form.new_password1 }}

      {{ form.new_password2.label_tag }}
      {{ form.new_password2 }}

      <button type="submit" class="mt-4 py-2 px-6 bg-teal-600 text-white rounded hover:bg-teal-700">
        Change Password
      </button>
    </form>
  </div>
{% endblock %}
