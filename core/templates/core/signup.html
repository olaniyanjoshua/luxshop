{% extends 'core/base.html' %}

{% block title %} Signup {% endblock %}

{% block content %}
<div class="max-w-2xl mx-auto bg-white shadow-lg rounded-xl p-8 mt-10">
    <h1 class="text-3xl font-bold text-emerald-700 mb-6 text-center">Sign Up</h1>

    <form method="POST" action="." class="space-y-6">
        {% csrf_token %}

        <div>
            <label class="block mb-2 text-sm font-medium text-gray-700 text-center">
                Username
            </label>
            <input type="text" name="username" required
                class="w-full p-3 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-300 focus:border-blue-400"
                value="{{ form.username.value|default:'' }}">
        </div>

        <div>
            <label class="block mb-2 text-sm font-medium text-gray-700 text-center">
                Email
            </label>
            <input type="email" name="email" required
                class="w-full p-3 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-300 focus:border-blue-400"
                value="{{ form.email.value|default:'' }}">
        </div>

        <div>
            <label class="block mb-2 text-sm font-medium text-gray-700 text-center">
                Password
            </label>
            <input type="password" name="password1" required
                class="w-full p-3 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-300 focus:border-blue-400">
        </div>

        <div>
            <label class="block mb-2 text-sm font-medium text-gray-700 text-center">
                Confirm Password
            </label>
            <input type="password" name="password2" required
                class="w-full p-3 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-300 focus:border-blue-400">
        </div>

        {% if form.errors or form.non_field_errors %}
            <div class="p-4 rounded-lg bg-red-100 text-red-700">
                {% for field in form %}
                    {{ field.errors }}
                {% endfor %}
                {{ form.non_field_errors }}
            </div>
        {% endif %}

        <div class="text-center">
            <button type="submit" 
                class="py-4 px-8 text-lg bg-teal-500 hover:bg-teal-700 rounded-xl text-center">
                Submit
            </button>
        </div>
    </form>
</div>
{% endblock %}
