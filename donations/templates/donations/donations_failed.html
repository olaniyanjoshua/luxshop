{% extends 'core/base.html' %}
{% block title %}Donation Failed{% endblock %}

{% block content %}
<div style="text-align: center; padding: 20px;">
    <h2 style="color: red;">Transaction Failed</h2>
    <p>Unfortunately, your donation could not be processed.</p>

    {% if reference %}
        <p><strong>Reference:</strong> {{ reference }}</p>
    {% endif %}

    {% if error %}
        <p style="color: gray;">{{ error }}</p>
    {% endif %}

    <a href="{% url 'donations:make_donation' %}" 
       style="display: inline-block; margin-top: 15px; padding: 10px 20px; background: #007bff; color: white; text-decoration: none; border-radius: 5px;">
       Try Again
    </a>
</div>
{% endblock %}
