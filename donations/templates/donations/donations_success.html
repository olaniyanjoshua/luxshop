{% extends 'core/base.html' %}
{% block title %}Donation Successful{% endblock %}

{% block content %}
<div class="max-w-2xl mx-auto bg-white shadow-lg rounded-xl p-8 mt-10 text-center">
    <div class="mb-6">
        <svg class="w-16 h-16 mx-auto text-emerald-600" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" d="M5 13l4 4L19 7" />
        </svg>
    </div>
    <h2 class="text-3xl font-bold text-emerald-700 mb-4">Payment Successful</h2>
    <p class="text-gray-600 mb-2">Thank you for your generous donation!</p>
    <p class="text-gray-700 font-medium">Reference: <span class="text-gray-900">{{ donation.reference }}</span></p>
    <p class="text-gray-700 font-medium">Amount: <span class="text-gray-900">&#8358;{{ donation.amount }}</span></p>

    <div class="mt-6">
        <a href="{% url 'donations:make_donation' %}" 
           class="bg-emerald-700 hover:bg-emerald-800 text-white px-6 py-3 rounded-lg shadow transition duration-200">
            Make Another Donation
        </a>
    </div>
</div>
{% endblock %}
